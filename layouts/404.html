{{ define "main" }}
<section class="wrap erro">
  <p class="rotulo">Erro 404</p>
  <h1>Esta pasta não está no arquivo</h1>
  <p class="linha">O endereço pode ter mudado ou ter sido digitado errado. Procure o caso pelo nome ou volte para um dos caminhos abaixo.</p>
  <p><button class="botao" type="button" data-abrir-busca>{{ partial "icone.html" "busca" }}<span>Buscar no Porão</span></button></p>
  <ul class="erro-links">
    <li><a href="{{ site.Home.RelPermalink }}">Página inicial</a></li>
    {{ range site.Menus.main }}<li><a href="{{ .URL }}">{{ .Name }}</a></li>{{ end }}
    <li><a href="{{ site.Params.portal }}">O Portal</a></li>
  </ul>
</section>
{{ end }}
