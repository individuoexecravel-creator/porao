{{ define "main" }}

    <p class="rotulo">{{ with .Params.rotulo }}{{ . }}{{ else }}O Porão{{ end }}</p>

  </header>
  <div class="dossie__texto">{{ .Content }}</div>
</article>
{{ end }}
