{{ define "main" }}
<header class="wrap cabeca-lista">
  <nav class="trilha" aria-label="Você está em"><a href="{{ site.Home.RelPermalink }}">Início</a><span aria-hidden="true">›</span><span aria-current="page">{{ .Title }}</span></nav>
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="linha">{{ . }}</p>{{ end }}
</header>
<div class="wrap materia materia-simples">
  <article class="texto">
    {{ .Content }}
    {{ partial "autor.html" . }}
  </article>
</div>
{{ end }}
