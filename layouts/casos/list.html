{{ define "main" }}
<header class="wrap cabeca-lista">
  <nav class="trilha" aria-label="Você está em"><a href="{{ site.Home.RelPermalink }}">Início</a><span aria-hidden="true">›</span><span aria-current="page">{{ .Title }}</span></nav>
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p class="linha">{{ . }}</p>{{ end }}
</header>
<section class="wrap bloco bloco-lista">
  {{ if .Pages }}
    <div class="quadro">
      <div class="grade-fichas">
        {{ range .Paginator.Pages }}{{ partial "ficha-card.html" . }}{{ end }}
      </div>
    </div>
    {{ template "_internal/pagination.html" . }}
  {{ else }}
    {{ partial "vazio.html" . }}
  {{ end }}
</section>
{{ end }}
