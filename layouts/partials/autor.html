{{- /* Quem escreve. Recebe a página. Na página inicial, aparece em tamanho grande, como ficha de investigador. */ -}}
{{ with site.Params.autor }}
<div class="autor">
  <img src="{{ "img/investigador.jpg" | relURL }}" alt="" width="72" height="90">
  <div>
    <p class="autor-nome"><a href="{{ "sobre/" | relURL }}">{{ .nome }}</a></p>
    <p class="autor-funcao">{{ .funcao }}</p>
    <p class="autor-bio">{{ .bio }}</p>
    {{ partial "redes.html" (dict "nomes" true) }}
  </div>
</div>
{{ end }}
