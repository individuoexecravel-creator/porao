{{- /* Linha do tempo das vítimas conhecidas, 1989–1993. Dados em data/altamira.yaml. */ -}}
{{- $v := site.Data.altamira.vitimas -}}
{{- $ini := 1989.4 }}{{ $fim := 1993.8 }}{{ $L := 40.0 }}{{ $W := 820.0 -}}
<figure class="grafico grafico-vitimas" aria-labelledby="gv-t">
  <figcaption class="grafico-cab">
    <p class="grafico-t" id="gv-t">Os meninos atacados em Altamira, mês a mês</p>
    <p class="grafico-d">Vítimas citadas neste dossiê, de agosto de 1989 a julho de 1993. Não é a lista completa: o número total muda conforme a fonte.</p>
  </figcaption>
  <svg viewBox="0 -40 900 200" class="grafico-svg" aria-hidden="true" focusable="false">
    <line x1="{{ $L }}" y1="110" x2="{{ add $L $W }}" y2="110" class="g-eixo"/>
    {{- range seq 1990 1993 }}
      {{- $x := add $L (div (mul (sub (float .) $ini) $W) (sub $fim $ini)) }}
      <line x1="{{ $x }}" y1="104" x2="{{ $x }}" y2="116" class="g-eixo"/>
      <text x="{{ $x }}" y="140" class="g-ano" text-anchor="middle">{{ . }}</text>
    {{- end }}
    {{- $prev := 0.0 }}{{ $pilha := 0 -}}
    {{- range $i, $p := $v }}
      {{- $t := time $p.data }}
      {{- $f := add (float $t.Year) (div (float (sub $t.YearDay 1)) 366.0) }}
      {{- $x := add $L (div (mul (sub $f $ini) $W) (sub $fim $ini)) }}
      {{- if lt (sub $x $prev) 24.0 }}{{ $pilha = add $pilha 1 }}{{ else }}{{ $pilha = 0 }}{{ end }}
      {{- $prev = $x }}
      {{- $y := sub 92 (mul $pilha 26) }}
      <line x1="{{ $x }}" y1="{{ add $y 7 }}" x2="{{ $x }}" y2="110" class="g-haste"/>
      <circle cx="{{ $x }}" cy="{{ $y }}" r="6.5" class="g-ponto g-{{ $p.tipo }}"/>
      <text x="{{ $x }}" y="{{ sub $y 12 }}" class="g-num" text-anchor="middle">{{ add $i 1 }}</text>
    {{- end }}
  </svg>
  <p class="grafico-legenda"><span><i class="lg lg-morto-desaparecido"></i>Morto ou desaparecido</span><span><i class="lg lg-sobreviveu"></i>Sobreviveu (não identificado)</span></p>
  <ol class="grafico-lista">
    {{- range $v }}
    <li><span class="gl-mes">{{ .mes }}</span><span class="gl-nome">{{ .nome }}</span>{{ with .nota }}<span class="gl-nota">{{ . }}</span>{{ end }}</li>
    {{- end }}
  </ol>
  <p class="grafico-fonte">Fontes: Paula Lacerda (<em>Cadernos Pagu</em>, 2015); lista de vítimas da Wikipedia e do acervo do Projeto Humanos. Os sobreviventes não são nomeados.</p>
</figure>
