{{- /* Quantas foram as vítimas: três números, três fontes. */ -}}
<figure class="grafico grafico-numeros" aria-labelledby="gn-t">
  <figcaption class="grafico-cab">
    <p class="grafico-t" id="gn-t">Quantos foram os meninos? Depende de quem conta</p>
  </figcaption>
  <div class="numeros">
    <div class="numero papel" style="--giro:-1.2deg">
      <span class="numero-n">18</span>
      <span class="numero-d">crianças atingidas, 10 mortas</span>
      <span class="numero-f">Trabalho de conclusão de curso, UFPA, 2010</span>
    </div>
    <div class="numero papel" style="--giro:.8deg">
      <span class="numero-n">19</span>
      <span class="numero-d">vítimas, segundo as famílias</span>
      <span class="numero-f">Reuters, 2003</span>
    </div>
    <div class="numero papel" style="--giro:-.5deg">
      <span class="numero-n">26</span>
      <span class="numero-d">crianças desaparecidas, mortas ou mutiladas</span>
      <span class="numero-f">Paula Lacerda, <em>Cadernos Pagu</em>, 2015</span>
    </div>
  </div>
  <p class="grafico-fonte">O júri de 2003 tratou de apenas três mortes.</p>
</figure>
